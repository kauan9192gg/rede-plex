name: CodigoResgate
main: com.codigoresgate.CodigoResgate
version: 1.0.0
description: Sistema de codigos de resgate
commands:
  codigo:
    description: Resgatar um codigo
    usage: /codigo <codigo>
  admcod:
    description: Administrar codigos de resgate
    usage: /admcod
permissions:
  codigo.usar:
    description: Permite resgatar codigos
    default: true
  codigo.admin:
    description: Permite administrar codigos
    default: op
