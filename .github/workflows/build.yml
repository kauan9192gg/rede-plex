name: Compilar plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compilar
        run: mvn -B package
      - name: Guardar o .jar
        uses: actions/upload-artifact@v4
        with:
          name: CodigoResgate
          path: target/CodigoResgate.jar
